<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
:root{--gold:#D4AF37;--gold-dark:#b8952b;--dark:#0f0f0f;--sidebar:#151515;--card:#1a1a1a;--text:#f4f4f4;--muted:#a0a0a0;--green:#2e7d32;--red:#c62828;--border:rgba(212,175,55,.2);--fh:'Playfair Display',serif;--fb:'Poppins',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--dark);color:var(--text);line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:var(--sidebar);border-right:1px solid var(--border);position:fixed;height:100vh;top:0;left:0;z-index:1000;display:flex;flex-direction:column;transition:left .3s;overflow-y:auto}
.sidebar-head{padding:25px 20px;text-align:center;border-bottom:1px solid var(--border)}
.sidebar-head h2{font-family:var(--fh);color:var(--gold);font-size:1.4rem;word-break:break-word;line-height:1.2}
.sidebar-head p{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:5px}
.sidebar-info{padding:15px 20px;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--border)}
.sidebar-info i{color:var(--gold);margin-right:8px;width:14px}
.sidebar-info p{margin-bottom:6px}
.nav-links{list-style:none;padding:15px 0;flex-grow:1}
.nav-links a{display:flex;align-items:center;padding:12px 22px;color:var(--text);text-decoration:none;font-size:.92rem;transition:all .3s;border-left:3px solid transparent;cursor:pointer}
.nav-links a i{margin-right:14px;width:18px;color:var(--gold);font-size:1rem}
.nav-links a:hover,.nav-links a.active{background:rgba(212,175,55,.1);border-left-color:var(--gold);color:var(--gold)}
.sidebar-cta{padding:15px;border-top:1px solid var(--border)}
.btn-gold{display:block;width:100%;padding:12px;background:var(--gold);color:#000;text-align:center;text-decoration:none;border-radius:6px;font-weight:600;border:none;cursor:pointer;transition:all .3s;font-family:var(--fb);font-size:.9rem;margin-bottom:8px}
.btn-gold:hover{background:var(--gold-dark)}
.btn-outline{padding:12px 28px;border:2px solid var(--gold);color:var(--gold);text-decoration:none;border-radius:6px;font-weight:600;background:transparent;cursor:pointer;font-family:var(--fb);font-size:.9rem;display:inline-block;text-align:center;transition:all .3s}
.btn-outline:hover{background:var(--gold);color:#000}
.btn-wa{background:#25D366;color:#fff}
.btn-call{background:#2A5C82;color:#fff}
.main{margin-left:280px;width:calc(100% - 280px);min-height:100vh}
.toggle{display:none;position:fixed;top:15px;left:15px;z-index:1001;background:var(--gold);color:#000;border:none;width:45px;height:45px;border-radius:8px;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999}
.overlay.on{display:block}
.hero{height:100vh;min-height:560px;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.88)),var(--hero-img,url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80')) center/cover;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.hero h1{font-family:var(--fh);font-size:clamp(2rem,6vw,4.5rem);color:var(--gold);margin-bottom:12px;text-shadow:2px 2px 15px rgba(0,0,0,.9);line-height:1.1}
.hero .tagline{font-size:clamp(.85rem,2vw,1.15rem);color:#fff;letter-spacing:3px;text-transform:uppercase;margin-bottom:30px}
.hero-btns{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}
.hero-rating{margin-top:25px;color:var(--gold)}
section{padding:80px 40px}
.sec-title{text-align:center;margin-bottom:45px}
.sec-title h2{font-family:var(--fh);font-size:clamp(1.6rem,4vw,2.4rem);color:var(--gold);margin-bottom:10px}
.sec-title .divider{width:80px;height:3px;background:var(--gold);margin:0 auto 15px}
.sec-title p{color:var(--muted);max-width:600px;margin:0 auto;font-size:.95rem}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px;max-width:1100px;margin:0 auto}
.about-card{background:var(--card);padding:35px 25px;border-radius:12px;text-align:center;border:1px solid var(--border);transition:transform .3s}
.about-card:hover{transform:translateY(-8px);border-color:var(--gold)}
.about-card i{font-size:2.5rem;color:var(--gold);margin-bottom:18px}
.about-card h3{font-family:var(--fh);font-size:1.25rem;margin-bottom:12px;color:#fff}
.about-card p{color:var(--muted);font-size:.88rem}
.menu-controls{max-width:1100px;margin:0 auto 25px;display:flex;flex-direction:column;gap:18px;align-items:center}
.diet-tabs{display:flex;gap:0;background:var(--card);border-radius:30px;padding:5px;border:1px solid var(--border);max-width:100%;overflow-x:auto}
.diet-tab{padding:10px 24px;border:none;background:transparent;color:var(--muted);border-radius:25px;cursor:pointer;font-family:var(--fb);font-size:.85rem;font-weight:500;white-space:nowrap;transition:all .3s;display:flex;align-items:center;gap:8px}
.diet-tab .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.diet-tab.veg .dot{background:var(--green)}
.diet-tab.nonveg .dot{background:var(--red)}
.diet-tab.active{background:var(--gold);color:#000}
.diet-tab.active .dot{background:#000}
.diet-tab.veg.active{background:var(--green);color:#fff}
.diet-tab.veg.active .dot{background:#fff}
.diet-tab.nonveg.active{background:var(--red);color:#fff}
.diet-tab.nonveg.active .dot{background:#fff}
.search-bar{width:100%;max-width:500px;position:relative}
.search-bar input{width:100%;padding:14px 20px 14px 48px;background:var(--card);border:1px solid var(--border);border-radius:30px;color:#fff;font-family:var(--fb);font-size:.95rem;outline:none}
.search-bar input:focus{border-color:var(--gold)}
.search-bar i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--gold)}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.filter-btn{padding:7px 18px;background:transparent;border:1px solid var(--border);color:var(--text);border-radius:20px;cursor:pointer;font-family:var(--fb);font-size:.78rem;transition:all .3s}
.filter-btn:hover,.filter-btn.active{background:var(--gold);color:#000;border-color:var(--gold)}
.menu-section-title{max-width:1200px;margin:35px auto 15px;padding:0 10px;font-family:var(--fh);color:var(--gold);font-size:1.25rem;display:flex;align-items:center;gap:12px}
.menu-section-title .line{flex:1;height:1px;background:var(--border)}
.menu-section-title .count{font-size:.75rem;color:#888;font-family:var(--fb);font-weight:400}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.menu-item{background:var(--card);padding:18px;border-radius:10px;border:1px solid rgba(255,255,255,.05);transition:all .3s}
.menu-item:hover{border-color:var(--border);transform:translateX(3px)}
.menu-item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:5px}
.menu-item-title{font-size:.95rem;font-weight:500;display:flex;align-items:center;gap:8px;flex:1}
.veg-icon,.nonveg-icon{width:14px;height:14px;border:2px solid;display:flex;align-items:center;justify-content:center;border-radius:3px;flex-shrink:0}
.veg-icon{border-color:var(--green)}.veg-icon::after{content:'';width:6px;height:6px;background:var(--green);border-radius:50%}
.nonveg-icon{border-color:var(--red)}.nonveg-icon::after{content:'';width:6px;height:6px;background:var(--red);border-radius:50%}
.menu-item-price{font-weight:700;color:var(--gold);white-space:nowrap;font-size:1rem}
.menu-item-desc{font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:3px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);transition:all .3s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);border-color:var(--gold)}
.card-img{width:100%;height:220px;object-fit:cover;background:#222}
.card-body{padding:20px;flex:1;display:flex;flex-direction:column}
.card-body h3{font-family:var(--fh);color:#fff;font-size:1.15rem;margin-bottom:8px}
.card-body .price{color:var(--gold);font-weight:700;font-size:1.2rem;margin-bottom:10px}
.card-body p{color:var(--muted);font-size:.85rem;line-height:1.6;flex:1;margin-bottom:15px}
.card-features{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}
.card-features span{background:rgba(212,175,55,.15);color:var(--gold);padding:3px 10px;border-radius:12px;font-size:.7rem}
.card-actions{display:flex;gap:8px}
.card-actions .btn-gold,.card-actions .btn-outline{margin:0;padding:10px;font-size:.82rem;flex:1}
.viewer-3d{max-width:600px;margin:0 auto;background:radial-gradient(circle,#222,#0a0a0a);border-radius:20px;padding:40px;border:1px solid var(--border);text-align:center;position:relative;overflow:hidden}
.viewer-3d .stage{perspective:1200px;width:100%;height:320px;display:flex;align-items:center;justify-content:center;cursor:grab}
.viewer-3d .stage:active{cursor:grabbing}
.viewer-3d .object{transform-style:preserve-3d;transition:transform .1s;max-width:280px}
.viewer-3d img{max-width:280px;border-radius:12px;box-shadow:0 20px 60px rgba(212,175,55,.3);pointer-events:none}
.viewer-3d .hint{color:var(--muted);font-size:.8rem;margin-top:15px}
.viewer-3d .tabs3d{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.viewer-3d .tabs3d img{width:50px;height:50px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .3s;object-fit:cover}
.viewer-3d .tabs3d img.active{border-color:var(--gold)}
.plans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:1000px;margin:0 auto}
.plan{background:var(--card);padding:30px 25px;border-radius:14px;border:1px solid var(--border);text-align:center;position:relative;transition:all .3s}
.plan:hover{transform:translateY(-8px);border-color:var(--gold)}
.plan.featured{border-color:var(--gold);box-shadow:0 0 30px rgba(212,175,55,.2)}
.plan.featured::before{content:'POPULAR';position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;padding:4px 14px;border-radius:12px;font-size:.7rem;font-weight:700}
.plan h3{font-family:var(--fh);color:#fff;font-size:1.3rem;margin-bottom:5px}
.plan .price{font-size:2rem;color:var(--gold);font-weight:700;margin:15px 0}
.plan .price small{font-size:.8rem;color:var(--muted);font-weight:400}
.plan ul{list-style:none;text-align:left;margin:20px 0;padding:0}
.plan ul li{padding:8px 0;color:var(--muted);font-size:.85rem;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:8px}
.plan ul li i{color:var(--gold);font-size:.8rem}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.gallery-item{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--border);transition:transform .3s;cursor:pointer}
.gallery-item:hover{transform:scale(1.04)}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.booking-wrap{max-width:800px;margin:0 auto;background:var(--card);padding:40px;border-radius:14px;border:1px solid var(--border)}
.booking-form{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.booking-form .full{grid-column:1/-1}
.form-group label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;background:#0f0f0f;border:1px solid #333;border-radius:8px;color:#fff;font-family:var(--fb);font-size:.9rem;outline:none;transition:border .3s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold)}
.form-group textarea{resize:vertical;min-height:80px}
.contact-wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.contact-info{display:flex;flex-direction:column;gap:15px}
.contact-card{display:flex;align-items:flex-start;gap:18px;background:var(--card);padding:22px;border-radius:10px;border:1px solid var(--border)}
.contact-card i{font-size:1.3rem;color:var(--gold);margin-top:3px;width:24px;text-align:center}
.contact-card h4{font-family:var(--fh);font-size:1rem;margin-bottom:4px;color:#fff}
.contact-card p{color:var(--muted);font-size:.85rem;line-height:1.5}
.map-box{border-radius:12px;overflow:hidden;border:1px solid var(--border);min-height:420px;background:var(--card)}
.map-box iframe{width:100%;height:100%;border:0;display:block;min-height:420px}
.privacy-wrap{max-width:900px;margin:0 auto;background:var(--card);padding:35px;border-radius:12px;border:1px solid var(--border)}
.privacy-wrap h3{font-family:var(--fh);color:var(--gold);margin:22px 0 10px;font-size:1.1rem}
.privacy-wrap h3:first-child{margin-top:0}
.privacy-wrap p,.privacy-wrap li{color:var(--muted);font-size:.88rem;line-height:1.7;margin-bottom:8px}
.privacy-wrap ul{padding-left:22px;margin-bottom:10px}
footer{background:#080808;padding:50px 40px 25px;border-top:1px solid var(--border)}
.footer-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:35px;margin-bottom:30px}
.footer-col h4{font-family:var(--fh);color:var(--gold);margin-bottom:15px;font-size:1.05rem}
.footer-col p,.footer-col a{color:var(--muted);font-size:.85rem;line-height:1.9;text-decoration:none;display:block;transition:color .3s;cursor:pointer}
.footer-col a:hover{color:var(--gold)}
.footer-social a{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--card);color:var(--gold);margin-right:8px;margin-top:10px;transition:all .3s;text-decoration:none}
.footer-social a:hover{background:var(--gold);color:#000}
.footer-bottom{text-align:center;padding-top:22px;border-top:1px solid var(--border);color:var(--muted);font-size:.8rem}
.float-wa{position:fixed;bottom:25px;left:25px;width:58px;height:58px;background:#25D366;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 4px 15px rgba(37,211,102,.5);z-index:998;text-decoration:none}
.float-wa:hover{transform:scale(1.1);color:#fff}
.float-top{position:fixed;bottom:95px;right:25px;width:48px;height:48px;background:var(--gold);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;z-index:998;border:none;cursor:pointer;opacity:0;pointer-events:none;transition:all .3s}
.float-top.show{opacity:1;pointer-events:auto}
@media(max-width:992px){
.sidebar{left:-280px;box-shadow:5px 0 25px rgba(0,0,0,.5)}
.sidebar.on{left:0}
.main{margin-left:0;width:100%}
.toggle{display:block}
.hero{height:auto;padding:120px 20px 80px;min-height:100vh}
.contact-wrap{grid-template-columns:1fr}
.footer-grid{grid-template-columns:1fr;text-align:center}
section{padding:60px 20px}
.booking-wrap{padding:25px}
.booking-form{grid-template-columns:1fr}
.map-box,.map-box iframe{min-height:320px}
}
@media(max-width:576px){
section{padding:50px 15px}
.hero{padding:100px 15px 60px}
.hero-btns{flex-direction:column;width:100%;max-width:250px}
.hero-btns a{width:100%}
.menu-grid,.card-grid{grid-template-columns:1fr}
.gallery-grid{grid-template-columns:repeat(2,1fr)}
.float-wa{width:52px;height:52px;font-size:1.4rem}
.float-top{width:44px;height:44px;bottom:80px}
.plans-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<button class="toggle" id="toggle"><i class="fas fa-bars"></i></button>
<div class="overlay" id="overlay"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h2 id="sideName">Business</h2>
      <p id="sideTag">Demo</p>
    </div>
    <div class="sidebar-info">
      <p><i class="fas fa-phone"></i> <span id="sidePhone">+91 XXXXXXXXXX</span></p>
      <p><i class="fas fa-clock"></i> <span id="sideHours">9AM - 9PM</span></p>
    </div>
    <ul class="nav-links" id="navLinks"></ul>
    <div class="sidebar-cta">
      <button class="btn-gold btn-wa" id="sideWaBtn"><i class="fab fa-whatsapp"></i> WhatsApp</button>
      <a class="btn-gold btn-call" id="sideCallBtn" style="margin-bottom:0;"><i class="fas fa-phone-alt"></i> Call Now</a>
    </div>
  </aside>
  <main class="main" id="mainContent"></main>
</div>

<a class="float-wa" id="floatWa" target="_blank"><i class="fab fa-whatsapp"></i></a>
<button class="float-top" id="floatTop"><i class="fas fa-arrow-up"></i></button>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

// DECODE
function decodeData(){const p=new URLSearchParams(location.search);const e=p.get('d');if(!e)return null;try{let b=e.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(decodeURIComponent(escape(atob(b))))}catch(err){console.error(err);return null}}
function getFromParams(){const p=new URLSearchParams(location.search);if(!p.get('name'))return null;const itemsRaw=p.get('items')||'';const items=itemsRaw.split('|').filter(Boolean).map(i=>{const x=i.split(':');return{name:x[0]||'',price:x[1]||'0',type:x[2]||'veg',category:x[3]||'general',desc:x[4]||''}});return{type:p.get('type')||'generic',name:p.get('name'),tagline:p.get('tagline')||'',phone:p.get('phone')||'+91 76019 55153',email:p.get('email')||'info@business.com',address:p.get('address')||'Address',hours:p.get('hours')||'Mon - Sun: 9AM - 9PM',about:p.get('about')||`Welcome to ${p.get('name')}.`,mapQuery:p.get('map')||'',zomato:p.get('zomato')||'',swiggy:p.get('swiggy')||'',items:items,heroImg:p.get('hero')||'',gallery:[]}}

const DEFAULTS={type:'generic',name:'Demo Business',tagline:'Business Services',phone:'+91 76019 55153',email:'info@business.com',address:'123 Main Street, City',hours:'Mon - Sun: 9AM - 9PM',about:'Welcome to our business.',zomato:'',swiggy:'',mapQuery:'',heroImg:'',items:[{name:'Service 1',price:'999',type:'veg',category:'general',desc:'Description'}],gallery:[]};

let R=decodeData()||getFromParams()||DEFAULTS;
if(!R.type)R.type='generic';
let CFG=CONFIG[R.type]||CONFIG.generic;

function renderContact(){const mq=R.mapQuery||R.address;return`${sectionHTML('contact','Contact Us','We\'d love to hear from you.')}<div class="contact-wrap"><div class="contact-info"><div class="contact-card"><i class="fas fa-map-marker-alt"></i><div><h4>Location</h4><p>${R.address}</p></div></div><div class="contact-card"><i class="fas fa-phone-alt"></i><div><h4>Phone</h4><p>${R.phone}</p></div></div><div class="contact-card"><i class="fas fa-envelope"></i><div><h4>Email</h4><p>${R.email}</p></div></div><div class="contact-card"><i class="fas fa-clock"></i><div><h4>Hours</h4><p>${R.hours}</p></div></div></div><div class="map-box"><iframe src="https://www.google.com/maps?q=${encodeURIComponent(mq)}&output=embed" loading="lazy"></iframe></div></div></section>`}
function renderPrivacy(){return`${sectionHTML('privacy','Privacy Policy')}<div class="privacy-wrap"><h3>1. Information We Collect</h3><p>We collect personal information like name, phone, email when you book services.</p><h3>2. How We Use It</h3><ul><li>Confirming bookings</li><li>WhatsApp confirmations</li><li>Improving services</li><li>Responding to inquiries</li></ul><h3>3. Data Protection</h3><p>We protect your data. We don't sell your information.</p><h3>4. Third-Party</h3><p>We use Google Maps, WhatsApp, and other services.</p><h3>5. Contact</h3><p>For privacy questions: ${R.phone} or ${R.email}</p></div></section>`}
function renderFooter(){const cp=(R.phone||'').replace(/[^0-9]/g,'');return`<footer><div class="footer-grid"><div class="footer-col"><h4>${R.name}</h4><p>${R.about.substring(0,100)}...</p><div class="footer-social"><a href="#"><i class="fab fa-facebook-f"></i></a><a href="#"><i class="fab fa-instagram"></i></a><a href="https://wa.me/${cp}" target="_blank"><i class="fab fa-whatsapp"></i></a></div></div><div class="footer-col"><h4>Quick Links</h4><a data-scroll="home">Home</a><a data-scroll="about">About</a>${CFG.sections.includes('menu')?`<a data-scroll="menu">${CFG.itemLabel}</a>`:''}${CFG.sections.includes('booking')?`<a data-scroll="booking">Book</a>`:''}<a data-scroll="privacy">Privacy</a></div><div class="footer-col"><h4>Contact</h4><p>📞 ${R.phone}</p><p>📍 ${R.address}</p><p>⏰ ${R.hours}</p></div></div><div class="footer-bottom">&copy; ${new Date().getFullYear()} ${R.name}. All Rights Reserved.</div></footer>`}

function buildPage(){const main=document.getElementById('mainContent');let html=renderHero();CFG.sections.forEach(s=>{switch(s){case'about':html+=renderAbout();break;case'menu':html+=renderMenu();break;case'collection':html+=renderMenu();break;case'viewer3d':html+=renderViewer3D();break;case'rooms':html+=renderRooms();break;case'plans':html+=renderPlans();break;case'classes':html+=renderClasses();break;case'doctors':html+=renderDoctors();break;case'services':html+=renderServices();break;case'stylists':html+=renderStylists();break;case'products':html+=renderProducts();break;case'properties':html+=renderProperties();break;case'courses':html+=renderCourses();break;case'faculty':html+=renderFaculty();break;case'packages':html+=renderPackages();break;case'amenities':html+=renderAmenities();break;case'areas':html+=renderAreas();break;case'gallery':html+=renderGallery();break;case'booking':html+=renderBooking();break;case'order':html+=renderOrder();break;case'contact':html+=renderContact();break;case'privacy':html+=renderPrivacy();break}});html+=renderFooter();main.innerHTML=html}

function renderRooms(){const rooms=R.rooms&&R.rooms.length?R.rooms:[{name:'Standard Room',price:'2500',desc:'Cozy room with amenities',img:GALLERY_LIBRARY.hotel[0],features:['AC','WiFi','TV']},{name:'Deluxe Room',price:'4500',desc:'Spacious with city view',img:GALLERY_LIBRARY.hotel[1],features:['AC','WiFi','TV','Balcony']},{name:'Suite',price:'7500',desc:'Luxury suite with living area',img:GALLERY_LIBRARY.hotel[2],features:['AC','WiFi','TV','Living Room']}];return`${sectionHTML('rooms','Our Rooms','Choose your perfect stay.')}<div class="card-grid">${rooms.map(r=>`<div class="card"><img class="card-img" src="${r.img}" loading="lazy"><div class="card-body"><h3>${r.name}</h3><div class="price">₹${r.price}<small style="color:var(--muted);font-weight:400;font-size:.75rem;">/night</small></div><p>${r.desc||''}</p>${r.features?`<div class="card-features">${r.features.map(f=>`<span>${f}</span>`).join('')}</div>`:''}<div class="card-actions"><button class="btn-gold" onclick="scrollToBooking()">Book Now</button></div></div></div>`).join('')}</div></section>`}
function renderPlans(){const plans=R.plans&&R.plans.length?R.plans:[{name:'Basic',price:'999',period:'mo',features:['Gym Access','Locker'],featured:false},{name:'Pro',price:'1999',period:'mo',features:['All Basic','Personal Trainer','Diet Plan'],featured:true},{name:'Premium',price:'3499',period:'mo',features:['All Pro','24/7 Access','Spa'],featured:false}];return`${sectionHTML('plans','Membership Plans','Choose what fits you.')}<div class="plans-grid">${plans.map(p=>`<div class="plan ${p.featured?'featured':''}"><h3>${p.name}</h3><div class="price">₹${p.price}<small>/${p.period||'mo'}</small></div><ul>${(p.features||[]).map(f=>`<li><i class="fas fa-check"></i> ${f}</li>`).join('')}</ul><button class="btn-gold" onclick="scrollToBooking()">Get Started</button></div>`).join('')}</div></section>`}
function renderClasses(){const classes=R.classes&&R.classes.length?R.classes:[{time:'6:00 AM',name:'Morning Yoga',trainer:'Priya Sharma'},{time:'8:00 AM',name:'CrossFit',trainer:'Rahul Verma'},{time:'5:00 PM',name:'Zumba',trainer:'Anjali Das'},{time:'7:00 PM',name:'Strength Training',trainer:'Vikram Singh'}];return`${sectionHTML('classes','Class Schedule','Join our expert-led classes.')}<div class="card-grid" style="max-width:900px;">${classes.map(c=>`<div class="card" style="padding:20px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><span style="color:var(--gold);font-weight:600;">${c.time}</span><i class="fas fa-clock" style="color:var(--muted);"></i></div><h3 style="font-size:1.1rem;margin-bottom:5px;">${c.name}</h3><p style="color:var(--muted);font-size:.85rem;">Trainer: ${c.trainer}</p></div>`).join('')}</div></section>`}
function renderDoctors(){const doctors=R.doctors&&R.doctors.length?R.doctors:[{name:'Dr. Anil Kumar',spec:'General Physician',exp:'15 years',img:GALLERY_LIBRARY.clinic[0]},{name:'Dr. Priya Sen',spec:'Pediatrician',exp:'10 years',img:GALLERY_LIBRARY.clinic[1]},{name:'Dr. Rajesh Roy',spec:'Cardiologist',exp:'20 years',img:GALLERY_LIBRARY.clinic[2]}];return`${sectionHTML('doctors','Our Doctors','Experienced medical team.')}<div class="card-grid">${doctors.map(d=>`<div class="card"><img class="card-img" src="${d.img}" loading="lazy"><div class="card-body"><h3>${d.name}</h3><div class="price" style="font-size:.95rem;">${d.spec}</div><p>Experience: ${d.exp}</p><div class="card-actions"><button class="btn-gold" onclick="scrollToBooking()">Book Appointment</button></div></div></div>`).join('')}</div></section>`}
function renderServices(){const s=R.items&&R.items.length?R.items:[{name:'General Checkup',price:'500',desc:'Full body checkup'},{name:'Consultation',price:'800',desc:'Specialist consult'},{name:'Blood Test',price:'300',desc:'Complete blood work'}];return`${sectionHTML('services','Our Services','Professional services.')}<div class="menu-grid">${s.map(x=>`<div class="menu-item"><div class="menu-item-head"><div class="menu-item-title">${x.name}</div><div class="menu-item-price">₹${x.price}</div></div>${x.desc?`<div class="menu-item-desc">${x.desc}</div>`:''}</div>`).join('')}</div></section>`}
function renderStylists(){const st=R.stylists&&R.stylists.length?R.stylists:[{name:'Neha',role:'Senior Stylist',img:GALLERY_LIBRARY.salon[0]},{name:'Riya',role:'Hair Expert',img:GALLERY_LIBRARY.salon[1]},{name:'Anjali',role:'Beauty Specialist',img:GALLERY_LIBRARY.salon[2]}];return`${sectionHTML('stylists','Our Stylists','Trained professionals.')}<div class="card-grid">${st.map(x=>`<div class="card" style="text-align:center;"><img class="card-img" src="${x.img}" style="border-radius:50%;width:150px;height:150px;margin:20px auto 0;" loading="lazy"><div class="card-body"><h3>${x.name}</h3><p style="color:var(--gold);">${x.role}</p></div></div>`).join('')}</div></section>`}
function renderProducts(){const p=R.products&&R.products.length?R.products:R.items||[];return`${sectionHTML('products','Our Products','Quality products.')}<div class="card-grid">${p.map(x=>`<div class="card">${x.img?`<img class="card-img" src="${x.img}" loading="lazy">`:''}<div class="card-body"><h3>${x.name}</h3><div class="price">₹${x.price}</div><p>${x.desc||'High-quality product'}</p><div class="card-actions"><button class="btn-gold" onclick="orderProduct('${x.name}')">Order</button></div></div></div>`).join('')}</div></section>`}
function renderProperties(){const p=R.properties&&R.properties.length?R.properties:[{name:'3 BHK Apartment',price:'55,00,000',loc:'Mumbai',type:'Apartment',img:GALLERY_LIBRARY.realestate[0]},{name:'Villa with Garden',price:'1,20,00,000',loc:'Pune',type:'Villa',img:GALLERY_LIBRARY.realestate[1]},{name:'Commercial Shop',price:'40,00,000',loc:'Delhi',type:'Commercial',img:GALLERY_LIBRARY.realestate[2]}];return`${sectionHTML('properties','Featured Properties','Find your dream property.')}<div class="card-grid">${p.map(x=>`<div class="card"><img class="card-img" src="${x.img}" loading="lazy"><div class="card-body"><h3>${x.name}</h3><div class="price">₹${x.price}</div><p><i class="fas fa-map-marker-alt"></i> ${x.loc}</p><div class="card-features"><span>${x.type}</span></div><div class="card-actions"><button class="btn-gold" onclick="scrollToBooking()">Enquire</button></div></div></div>`).join('')}</div></section>`}
function renderCourses(){const c=R.items&&R.items.length?R.items:[{name:'JEE Preparation',price:'45000',desc:'Complete JEE course'},{name:'NEET Preparation',price:'50000',desc:'Comprehensive NEET'},{name:'Board Exam',price:'25000',desc:'Class 11-12 prep'}];return`${sectionHTML('courses','Our Courses','Structured programs.')}<div class="card-grid">${c.map(x=>`<div class="card" style="padding:25px;"><h3>${x.name}</h3><div class="price">₹${x.price}</div><p>${x.desc||''}</p><div class="card-actions"><button class="btn-gold" onclick="scrollToBooking()">Enroll</button></div></div>`).join('')}</div></section>`}
function renderFaculty(){const f=R.faculty&&R.faculty.length?R.faculty:[{name:'Prof. Sharma',subject:'Mathematics',exp:'15 years'},{name:'Prof. Verma',subject:'Physics',exp:'12 years'},{name:'Prof. Iyer',subject:'Chemistry',exp:'10 years'}];return`${sectionHTML('faculty','Our Faculty','Experienced educators.')}<div class="card-grid">${f.map(x=>`<div class="card" style="padding:25px;text-align:center;"><i class="fas fa-user-circle" style="font-size:3rem;color:var(--gold);margin-bottom:15px;"></i><h3>${x.name}</h3><p style="color:var(--gold);">${x.subject}</p><p>Experience: ${x.exp}</p></div>`).join('')}</div></section>`}
function renderPackages(){const p=R.plans&&R.plans.length?R.plans:[{name:'Silver Package',price:'500',period:'plate',features:['5 Items','Veg + Non-Veg'],featured:false},{name:'Gold Package',price:'800',period:'plate',features:['8 Items','Premium Dishes','Live Counter'],featured:true},{name:'Platinum',price:'1200',period:'plate',features:['12 Items','Luxury Menu','Full Decor'],featured:false}];return`${sectionHTML('packages','Our Packages','Choose your package.')}<div class="plans-grid">${p.map(x=>`<div class="plan ${x.featured?'featured':''}"><h3>${x.name}</h3><div class="price">₹${x.price}<small>/${x.period||'plate'}</small></div><ul>${(x.features||[]).map(f=>`<li><i class="fas fa-check"></i> ${f}</li>`).join('')}</ul><button class="btn-gold" onclick="scrollToBooking()">Get Quote</button></div>`).join('')}</div></section>`}
function renderAmenities(){const a=[{icon:'fa-wifi',name:'Free WiFi'},{icon:'fa-swimming-pool',name:'Swimming Pool'},{icon:'fa-spa',name:'Spa'},{icon:'fa-dumbbell',name:'Fitness Center'},{icon:'fa-utensils',name:'Restaurant'},{icon:'fa-car',name:'Parking'},{icon:'fa-concierge-bell',name:'Room Service'},{icon:'fa-plane',name:'Airport Transfer'}];return`${sectionHTML('amenities','Our Amenities','Everything you need.')}<div class="about-grid">${a.map(x=>`<div class="about-card"><i class="fas ${x.icon}"></i><h3>${x.name}</h3></div>`).join('')}</div></section>`}
function renderAreas(){const a=R.areas||['Downtown','Suburbs','Uptown','East Zone','West Zone','North Area'];return`${sectionHTML('areas','Service Areas','We serve these locations.')}<div class="menu-grid">${a.map(x=>`<div class="menu-item" style="text-align:center;padding:25px;"><i class="fas fa-map-marker-alt" style="color:var(--gold);font-size:1.5rem;margin-bottom:10px;"></i><div style="font-weight:500;">${x}</div></div>`).join('')}</div></section>`}

let curDiet='all',curCat='all',searchQ='';
function buildFilters(){const items=R.items||R.menu||[];const cats=[...new Set(items.map(i=>i.category).filter(Boolean))];const cw=document.getElementById('catFilters');if(!cw)return;cw.innerHTML='<button class="filter-btn active" data-cat="all">All</button>';cats.sort().forEach(c=>{const b=document.createElement('button');b.className='filter-btn';b.dataset.cat=c;b.textContent=c.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase());cw.appendChild(b)});cw.onclick=e=>{if(e.target.classList.contains('filter-btn')){cw.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');curCat=e.target.dataset.cat;renderMenuItems()}}}
function renderMenuItems(){const container=document.getElementById('menuContainer');if(!container)return;const items=R.items||R.menu||[];if(!items.length){container.innerHTML='<p style="text-align:center;color:#999;padding:40px;">Coming soon.</p>';return}const filtered=items.filter(i=>{const dOK=curDiet==='all'||!CFG.hasVegNonVeg||i.type===curDiet;const cOK=curCat==='all'||i.category===curCat;const sOK=!searchQ||i.name.toLowerCase().includes(searchQ.toLowerCase());return dOK&&cOK&&sOK});if(!filtered.length){container.innerHTML='<p style="text-align:center;color:#999;padding:40px;">No items found.</p>';return}const groups={};filtered.forEach(item=>{const cat=item.category||'general';if(!groups[cat])groups[cat]=[];groups[cat].push(item)});container.innerHTML=Object.keys(groups).sort().map(cat=>`<h3 class="menu-section-title"><i class="fas fa-circle-notch icon"></i>${cat.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}<span class="line"></span><span class="count">${groups[cat].length} items</span></h3><div class="menu-grid">${groups[cat].map(item=>{const icon=CFG.hasVegNonVeg?(item.type==='veg'?'<span class="veg-icon"></span>':'<span class="nonveg-icon"></span>'):'';return`<div class="menu-item"><div class="menu-item-head"><div class="menu-item-title">${icon} ${item.name}</div><div class="menu-item-price">₹${item.price}</div></div>${item.desc?`<div class="menu-item-desc">${item.desc}</div>`:''}</div>`}).join('')}</div>`).join('')}

function init3DViewer(){const stage=document.getElementById('stage3d');const obj=document.getElementById('obj3d');const mainImg=document.getElementById('mainImg3d');const tabs=document.getElementById('tabs3d');if(!stage)return;let rotY=0,rotX=0,isDragging=false,lastX=0,lastY=0;function update(){obj.style.transform=`rotateY(${rotY}deg) rotateX(${rotX}deg)`}stage.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY});document.addEventListener('mousemove',e=>{if(!isDragging)return;rotY+=(e.clientX-lastX)*0.7;rotX-=(e.clientY-lastY)*0.5;rotX=Math.max(-45,Math.min(45,rotX));lastX=e.clientX;lastY=e.clientY;update()});document.addEventListener('mouseup',()=>isDragging=false);stage.addEventListener('touchstart',e=>{isDragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY});stage.addEventListener('touchmove',e=>{if(!isDragging)return;e.preventDefault();rotY+=(e.touches[0].clientX-lastX)*0.7;rotX-=(e.touches[0].clientY-lastY)*0.5;rotX=Math.max(-45,Math.min(45,rotX));lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;update()});stage.addEventListener('touchend',()=>isDragging=false);if(tabs){tabs.onclick=e=>{if(e.target.tagName==='IMG'){tabs.querySelectorAll('img').forEach(i=>i.classList.remove('active'));e.target.classList.add('active');mainImg.src=e.target.src;rotY=0;rotX=0;update()}}}}

function handleBooking(e){e.preventDefault();const name=document.getElementById('bkName').value;const phone=document.getElementById('bkPhone').value;const date=document.getElementById('bkDate').value;const d2=document.getElementById('bkDate2');const time=document.getElementById('bkTime');const guests=document.getElementById('bkGuests');const occ=document.getElementById('bkOccasion');const notes=document.getElementById('bkNotes').value;let msg=`*Booking — ${R.name}*\n\n👤 ${name}\n📞 ${phone}\n📅 ${date}\n`;if(d2)msg+=`📅 Check Out: ${d2.value}\n`;if(time)msg+=`🕐 ${time.value}\n`;if(guests)msg+=`📌 ${guests.value}\n`;if(occ&&occ.value)msg+=`📌 ${occ.value}\n`;if(notes)msg+=`📝 ${notes}\n`;const cp=(R.phone||'').replace(/[^0-9]/g,'');window.open(`https://wa.me/${cp}?text=${encodeURIComponent(msg)}`,'_blank')}
function orderWA(){const cp=(R.phone||'').replace(/[^0-9]/g,'');window.open(`https://wa.me/${cp}?text=${encodeURIComponent('Hi '+R.name+', I want to order.')}`,'_blank')}
function orderProduct(n){const cp=(R.phone||'').replace(/[^0-9]/g,'');window.open(`https://wa.me/${cp}?text=${encodeURIComponent('Hi, I want to order: '+n)}`,'_blank')}
function scrollToBooking(){const el=document.getElementById('booking');if(el)el.scrollIntoView({behavior:'smooth'})}

function init(){applyTheme();renderNav();buildPage();document.getElementById('sideName').textContent=R.name;document.getElementById('sideTag').textContent=R.tagline||CFG.tagline;document.getElementById('sidePhone').textContent=R.phone;document.getElementById('sideHours').textContent=R.hours;const cp=(R.phone||'').replace(/[^0-9]/g,'');const wa=`https://wa.me/${cp}`;document.getElementById('sideWaBtn').onclick=()=>window.open(wa,'_blank');document.getElementById('sideCallBtn').href=`tel:${cp}`;document.getElementById('floatWa').href=wa;document.getElementById('toggle').onclick=()=>{document.getElementById('sidebar').classList.toggle('on');document.getElementById('overlay').classList.toggle('on')};document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('on');document.getElementById('overlay').classList.remove('on')};document.querySelectorAll('[data-scroll]').forEach(el=>{el.addEventListener('click',e=>{e.preventDefault();const t=document.getElementById(el.dataset.scroll);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})})});buildFilters();renderMenuItems();const search=document.getElementById('search');if(search)search.addEventListener('input',e=>{searchQ=e.target.value;renderMenuItems()});const dt=document.getElementById('dietTabs');if(dt){dt.onclick=e=>{const btn=e.target.closest('.diet-tab');if(!btn)return;dt.querySelectorAll('.diet-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');curDiet=btn.dataset.diet;renderMenuItems()}}const form=document.getElementById('bookingForm');if(form){form.onsubmit=handleBooking;const d=document.getElementById('bkDate');if(d&&d.type==='date'){const today=new Date().toISOString().split('T')[0];d.min=today;d.value=today}}if(CFG.hasDateRange){flatpickr('#bkDate',{minDate:'today',dateFormat:'Y-m-d'});flatpickr('#bkDate2',{minDate:'today',dateFormat:'Y-m-d'})}init3DViewer();window.addEventListener('scroll',()=>{const btn=document.getElementById('floatTop');if(window.scrollY>400)btn.classList.add('show');else btn.classList.remove('show')});document.getElementById('floatTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'})}
init();
</script>
</body>
